<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missile Impact Simulator</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090e17;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .status-pill {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 50;
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 14px;
      pointer-events: none;
      color: #f8fafc;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .pill-title {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 2px;
    }
    .pill-sub {
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="statusPill" class="status-pill">
    <div class="pill-title" id="pillModeText">Map Click Mode: Target</div>
    <div class="pill-sub">Click globe to place pin | Drag pin to move | Drag globe to rotate</div>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken = "";

    // create esri satellite base layer
    const esriBaseProvider = new Cesium.UrlTemplateImageryProvider({
      url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      maximumLevel: 19,
      credit: "Esri World Imagery"
    });

    // create esri boundaries, places, and country borders overlay
    const esriBoundariesProvider = new Cesium.UrlTemplateImageryProvider({
      url: "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
      credit: "Esri Boundaries and Places"
    });

    let viewer;
    try {
      viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: new Cesium.ImageryLayer(esriBaseProvider),
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        sceneModePicker: false,
        selectionIndicator: false,
        timeline: false,
        navigationHelpButton: false,
        animation: false,
        fullscreenButton: false,
      });
    } catch (e) {
      viewer = new Cesium.Viewer("cesiumContainer", {
        imageryProvider: esriBaseProvider,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        sceneModePicker: false,
        selectionIndicator: false,
        timeline: false,
        navigationHelpButton: false,
        animation: false,
        fullscreenButton: false,
      });
    }

    // add boundaries and places reference overlay on top of satellite imagery
    viewer.imageryLayers.add(new Cesium.ImageryLayer(esriBoundariesProvider));

    viewer.resolutionScale = window.devicePixelRatio || 1.0;
    viewer.scene.globe.showGroundAtmosphere = false;
    viewer.scene.globe.enableLighting = false;

    // hard zoom distance limits (100m minimum, 25,000km maximum)
    viewer.scene.screenSpaceCameraController.minimumZoomDistance = 100.0;
    viewer.scene.screenSpaceCameraController.maximumZoomDistance = 25000000.0;

    let currentPickMode = "destination";
    let lastVersion = -1;
    let lastFlyId = -1;

    // track mouse clicks vs drags
    let isLeftDown = false;
    let startScreenPos = null;
    let draggedPin = null;
    let hasMovedPastThreshold = false;

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

    handler.setInputAction((movement) => {
      isLeftDown = true;
      startScreenPos = Cesium.Cartesian2.clone(movement.position);
      hasMovedPastThreshold = false;
      draggedPin = null;

      const picked = viewer.scene.pick(movement.position);
      if (Cesium.defined(picked) && picked.id) {
        const id = picked.id.id || picked.id;
        if (id === "origin_pin" || id === "dest_pin") {
          draggedPin = id;
          viewer.scene.screenSpaceCameraController.enableInputs = false;
        }
      }
    }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

    handler.setInputAction((movement) => {
      if (!isLeftDown) return;
      const dist = Cesium.Cartesian2.distance(startScreenPos, movement.endPosition);
      if (dist >= 6) {
        hasMovedPastThreshold = true;
      }
      if (draggedPin) {
        const ray = viewer.camera.getPickRay(movement.endPosition);
        const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        if (cartesian) {
          const entity = viewer.entities.getById(draggedPin);
          if (entity) {
            entity.position = cartesian;
          }
        }
      }
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    handler.setInputAction((movement) => {
      if (!isLeftDown) return;
      isLeftDown = false;
      viewer.scene.screenSpaceCameraController.enableInputs = true;

      if (draggedPin) {
        const ray = viewer.camera.getPickRay(movement.position);
        const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        if (cartesian) {
          const carto = Cesium.Cartographic.fromCartesian(cartesian);
          const lon = Cesium.Math.toDegrees(carto.longitude);
          const lat = Cesium.Math.toDegrees(carto.latitude);
          const role = (draggedPin === "origin_pin") ? "origin" : "destination";
          sendPick(role, lon, lat);
        }
        draggedPin = null;
        return;
      }

      // click without dragging places or moves pin
      if (!hasMovedPastThreshold) {
        const ray = viewer.camera.getPickRay(movement.position);
        const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        if (cartesian) {
          const carto = Cesium.Cartographic.fromCartesian(cartesian);
          const lon = Cesium.Math.toDegrees(carto.longitude);
          const lat = Cesium.Math.toDegrees(carto.latitude);
          sendPick(currentPickMode, lon, lat);
        }
      }
    }, Cesium.ScreenSpaceEventType.LEFT_UP);

    function sendPick(role, lon, lat) {
      fetch("/api/pick", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: role, longitude: lon, latitude: lat })
      }).catch((err) => {
        console.warn("pick post error", err);
      });
    }

    // calculates arc samples for ballistic trajectory
    function computeTrajectoryPoints(oLon, oLat, dLon, dLat, segments = 50) {
      const c1 = Cesium.Cartographic.fromDegrees(oLon, oLat);
      const c2 = Cesium.Cartographic.fromDegrees(dLon, dLat);
      const geodesic = new Cesium.EllipsoidGeodesic(c1, c2);
      const totalDist = geodesic.surfaceDistance;
      const peakAltitude = Math.min(Math.max(totalDist * 0.12, 10000.0), 900000.0);

      const positions = [];
      for (let i = 0; i <= segments; i++) {
        const f = i / segments;
        const interp = geodesic.interpolateUsingFraction(f);
        const h = Math.sin(f * Math.PI) * peakAltitude;
        positions.push(Cesium.Cartesian3.fromRadians(interp.longitude, interp.latitude, h));
      }
      return positions;
    }

    // calculates spherical circle boundary points for missile range
    function computeCirclePoints(centerLon, centerLat, radiusKm, numPoints = 72) {
      const points = [];
      const R = 6371.0;
      const radLat = Cesium.Math.toRadians(centerLat);
      const radLon = Cesium.Math.toRadians(centerLon);
      const dByR = radiusKm / R;

      for (let i = 0; i <= numPoints; i++) {
        const bearing = (i * 360.0 / numPoints) * Math.PI / 180.0;
        const lat = Math.asin(Math.sin(radLat) * Math.cos(dByR) + Math.cos(radLat) * Math.sin(dByR) * Math.cos(bearing));
        const lon = radLon + Math.atan2(Math.sin(bearing) * Math.sin(dByR) * Math.cos(radLat), Math.cos(dByR) - Math.sin(radLat) * Math.sin(lat));
        points.push(Cesium.Cartesian3.fromRadians(lon, lat, 100.0));
      }
      return points;
    }

    function renderState(state) {
      // 1. origin pin
      if (state.origin && typeof state.origin.longitude === "number") {
        const pos = Cesium.Cartesian3.fromDegrees(state.origin.longitude, state.origin.latitude, 0);
        let origEntity = viewer.entities.getById("origin_pin");
        if (!origEntity) {
          origEntity = viewer.entities.add({
            id: "origin_pin",
            position: pos,
            point: {
              pixelSize: 14,
              color: Cesium.Color.fromCssColorString("#22c55e"),
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2
            },
            label: {
              text: "ORIGIN: " + (state.origin.label || "Launch Site"),
              font: "12px sans-serif",
              fillColor: Cesium.Color.WHITE,
              showBackground: true,
              backgroundColor: Cesium.Color.fromCssColorString("#0f172a"),
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              pixelOffset: new Cesium.Cartesian2(0, -12)
            }
          });
        } else {
          origEntity.position = pos;
          origEntity.label.text = "ORIGIN: " + (state.origin.label || "Launch Site");
        }
      } else {
        viewer.entities.removeById("origin_pin");
      }

      // 2. destination pin
      if (state.destination && typeof state.destination.longitude === "number") {
        const pos = Cesium.Cartesian3.fromDegrees(state.destination.longitude, state.destination.latitude, 0);
        let destEntity = viewer.entities.getById("dest_pin");
        if (!destEntity) {
          destEntity = viewer.entities.add({
            id: "dest_pin",
            position: pos,
            point: {
              pixelSize: 14,
              color: Cesium.Color.fromCssColorString("#ef4444"),
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2
            },
            label: {
              text: "TARGET: " + (state.destination.label || "Detonation Target"),
              font: "12px sans-serif",
              fillColor: Cesium.Color.WHITE,
              showBackground: true,
              backgroundColor: Cesium.Color.fromCssColorString("#0f172a"),
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              pixelOffset: new Cesium.Cartesian2(0, -12)
            }
          });
        } else {
          destEntity.position = pos;
          destEntity.label.text = "TARGET: " + (state.destination.label || "Detonation Target");
        }
      } else {
        viewer.entities.removeById("dest_pin");
      }

      // 3. max range circle and glowing perimeter border
      if (state.origin && typeof state.origin.longitude === "number" && state.missile && state.missile.max_range_km) {
        const radiusKm = Math.min(Number(state.missile.max_range_km) || 0, 9500);
        const radiusMeters = radiusKm * 1000.0;
        const pos = Cesium.Cartesian3.fromDegrees(state.origin.longitude, state.origin.latitude, 0);

        let rangeEntity = viewer.entities.getById("range_circle");
        if (!rangeEntity) {
          rangeEntity = viewer.entities.add({
            id: "range_circle",
            position: pos,
            ellipse: {
              semiMajorAxis: radiusMeters,
              semiMinorAxis: radiusMeters,
              material: Cesium.Color.fromCssColorString("#38bdf8").withAlpha(0.14),
              outline: true,
              outlineColor: Cesium.Color.CYAN,
              outlineWidth: 2,
              height: 0
            }
          });
        } else {
          rangeEntity.position = pos;
          rangeEntity.ellipse.semiMajorAxis = radiusMeters;
          rangeEntity.ellipse.semiMinorAxis = radiusMeters;
        }

        const circlePoints = computeCirclePoints(state.origin.longitude, state.origin.latitude, radiusKm);
        let borderEntity = viewer.entities.getById("range_border_line");
        if (!borderEntity) {
          borderEntity = viewer.entities.add({
            id: "range_border_line",
            polyline: {
              positions: circlePoints,
              width: 3,
              material: new Cesium.PolylineGlowMaterialProperty({
                glowPower: 0.25,
                color: Cesium.Color.fromCssColorString("#38bdf8")
              }),
              clampToGround: true
            }
          });
        } else {
          borderEntity.polyline.positions = circlePoints;
        }
      } else {
        viewer.entities.removeById("range_circle");
        viewer.entities.removeById("range_border_line");
      }

      // 4. trajectory line
      if (state.origin && state.destination) {
        const arcPositions = computeTrajectoryPoints(
          state.origin.longitude, state.origin.latitude,
          state.destination.longitude, state.destination.latitude
        );
        let lineEntity = viewer.entities.getById("trajectory_line");
        if (!lineEntity) {
          lineEntity = viewer.entities.add({
            id: "trajectory_line",
            polyline: {
              positions: arcPositions,
              width: 3,
              material: new Cesium.PolylineGlowMaterialProperty({
                glowPower: 0.25,
                color: Cesium.Color.fromCssColorString("#38bdf8")
              })
            }
          });
        } else {
          lineEntity.polyline.positions = arcPositions;
        }
      } else {
        viewer.entities.removeById("trajectory_line");
      }

      // 5. blast rings if launched
      const blastRingIds = ["ring_light", "ring_thermal", "ring_moderate", "ring_heavy", "ring_fireball"];
      if (state.launched && state.impact && state.impact.radii_km && state.destination) {
        const r = state.impact.radii_km;
        const center = Cesium.Cartesian3.fromDegrees(state.destination.longitude, state.destination.latitude, 0);

        const ringDefs = [
          { id: "ring_light", radius: r.light_blast_1psi_km * 1000, color: "#facc15", alpha: 0.15, outline: "#eab308" },
          { id: "ring_thermal", radius: r.thermal_3rd_deg_km * 1000, color: "#f59e0b", alpha: 0.20, outline: "#f59e0b" },
          { id: "ring_moderate", radius: r.moderate_blast_5psi_km * 1000, color: "#f97316", alpha: 0.30, outline: "#ea580c" },
          { id: "ring_heavy", radius: r.heavy_blast_20psi_km * 1000, color: "#dc2626", alpha: 0.40, outline: "#b91c1c" },
          { id: "ring_fireball", radius: Math.max(r.fireball_km * 1000, 50), color: "#fef08a", alpha: 0.65, outline: "#fde047" },
        ];

        ringDefs.forEach((def) => {
          let ringEntity = viewer.entities.getById(def.id);
          if (!ringEntity) {
            viewer.entities.add({
              id: def.id,
              position: center,
              ellipse: {
                semiMajorAxis: def.radius,
                semiMinorAxis: def.radius,
                material: Cesium.Color.fromCssColorString(def.color).withAlpha(def.alpha),
                outline: true,
                outlineColor: Cesium.Color.fromCssColorString(def.outline),
                outlineWidth: 2
              }
            });
          } else {
            ringEntity.position = center;
            ringEntity.ellipse.semiMajorAxis = def.radius;
            ringEntity.ellipse.semiMinorAxis = def.radius;
          }
        });
      } else {
        blastRingIds.forEach((id) => viewer.entities.removeById(id));
      }
    }

    // poll backend state every 250ms
    async function pollState() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (!res.ok) return;
        const state = await res.json();

        if (state.pick_mode && state.pick_mode !== currentPickMode) {
          currentPickMode = state.pick_mode;
          const modeLabel = currentPickMode === "origin" ? "Origin" : "Target";
          const pill = document.getElementById("pillModeText");
          if (pill) pill.innerText = "Map Click Mode: " + modeLabel;
        }

        if (state.fly_to && state.fly_to.fly_id !== lastFlyId) {
          lastFlyId = state.fly_to.fly_id;
          const height = Math.max(state.fly_to.height || 350000.0, 100.0);
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(state.fly_to.lon, state.fly_to.lat, height),
            duration: 1.5
          });
        }

        if (state.version !== lastVersion) {
          lastVersion = state.version;
          renderState(state);
        }
      } catch (err) {
        // silent when connection is idle
      }
    }

    setInterval(pollState, 250);
  </script>
</body>
</html>
