<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missile Impact Simulator</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .status-pill {
      position: absolute;
      bottom: 44px; /* clear of the map credit line */
      left: 16px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.80);
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 8px 14px;
      pointer-events: none;
      color: #ededed;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .pill-title {
      font-size: 12px;
      font-weight: 700;
      color: #ededed;
      margin-bottom: 2px;
    }
    .pill-sub {
      font-size: 11px;
      color: #8a8a8a;
    }

    /* impact zone legend, shown after a launch */
    .legend {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 50;
      min-width: 236px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid #262626;
      border-radius: 10px;
      color: #ededed;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1), transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .legend.show { opacity: 1; transform: translateY(0); }
    .legend-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8a8a8a;
      margin-bottom: 8px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 22px;
    }
    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }
    .legend-name { flex: 1; }
    .legend-value {
      color: #8a8a8a;
      font-variant-numeric: tabular-nums;
    }
    @media (prefers-reduced-motion: reduce) {
      .legend { transform: none; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="statusPill" class="status-pill">
    <div class="pill-title" id="pillModeText">Map Click Mode: Launch site</div>
    <div class="pill-sub">Click globe to place pin | Drag pin to move | Drag globe to rotate</div>
  </div>
  <div id="legend" class="legend">
    <div class="legend-title">Impact zones</div>
    <div id="legendRows"></div>
  </div>

  <script type="module">
    const state0 = await (await fetch("/api/state", { cache: "no-store" })).json();
    if (!state0.mapbox_token) {
      document.getElementById("pillModeText").innerText = "Set the MAPBOX_TOKEN environment variable and restart";
    }
    mapboxgl.accessToken = state0.mapbox_token || "";

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/nbhjftd/cmwd3pzmm009601r50rex6p2b",
      projection: "globe",
      center: [0, 20],
      zoom: 1.3,
      minZoom: 1,
      maxZoom: 20,
    });
    await new Promise((resolve) => map.on("style.load", resolve));
    map.setFog({});

    let currentPickMode = "origin";
    let lastVersion = -1;
    let lastFlyId = -1;

    const EMPTY = { type: "FeatureCollection", features: [] };
    const line = (coords) => ({ type: "Feature", geometry: { type: "LineString", coordinates: coords } });
    const polygon = (ring, props) => ({ type: "Feature", properties: props || {}, geometry: { type: "Polygon", coordinates: [ring] } });

    // sources and layers, drawn bottom to top
    ["range", "zones", "trajectory"].forEach((id) => map.addSource(id, { type: "geojson", data: EMPTY }));
    map.addLayer({ id: "range-fill", type: "fill", source: "range", paint: { "fill-color": "#ffffff", "fill-opacity": 0.05 } });
    map.addLayer({ id: "range-line", type: "line", source: "range", paint: { "line-color": "#ffffff", "line-opacity": 0.55, "line-width": 3 } });
    map.addLayer({ id: "zones-fill", type: "fill", source: "zones", paint: { "fill-color": ["get", "color"], "fill-opacity": ["get", "alpha"] } });
    map.addLayer({ id: "zones-line", type: "line", source: "zones", paint: { "line-color": ["get", "color"], "line-opacity": 0.9, "line-width": 2 } });
    map.addLayer({ id: "trajectory-line", type: "line", source: "trajectory", paint: { "line-color": "#ffffff", "line-opacity": 0.9, "line-width": 3 } });

    function sendPick(role, lon, lat) {
      fetch("/api/pick", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: role, longitude: lon, latitude: lat })
      }).catch((err) => {
        console.warn("pick post error", err);
      });
    }

    // a click without dragging places or moves a pin (mapbox does not fire click after a drag)
    map.on("click", (e) => {
      if (currentPickMode !== "none") sendPick(currentPickMode, e.lngLat.lng, e.lngLat.lat);
    });

    // great-circle path from origin to destination
    function computeTrajectoryPoints(oLon, oLat, dLon, dLat, segments = 100) {
      const rad = Math.PI / 180;
      const [la1, lo1, la2, lo2] = [oLat * rad, oLon * rad, dLat * rad, dLon * rad];
      const d = 2 * Math.asin(Math.sqrt(Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2));
      const pts = [];
      let prevLon = oLon;
      for (let i = 0; i <= segments; i++) {
        const f = i / segments;
        const a = d ? Math.sin((1 - f) * d) / Math.sin(d) : 1;
        const b = d ? Math.sin(f * d) / Math.sin(d) : 0;
        const x = a * Math.cos(la1) * Math.cos(lo1) + b * Math.cos(la2) * Math.cos(lo2);
        const y = a * Math.cos(la1) * Math.sin(lo1) + b * Math.cos(la2) * Math.sin(lo2);
        const z = a * Math.sin(la1) + b * Math.sin(la2);
        let lon = Math.atan2(y, x) / rad;
        while (lon - prevLon > 180) lon -= 360;   // keep longitude continuous across the antimeridian
        while (lon - prevLon < -180) lon += 360;
        prevLon = lon;
        pts.push([lon, Math.atan2(z, Math.hypot(x, y)) / rad]);
      }
      return pts;
    }

    // closed ring of points at radiusKm around a centre
    function computeCirclePoints(centerLon, centerLat, radiusKm, numPoints = 72) {
      const points = [];
      const R = 6371.0;
      const radLat = centerLat * Math.PI / 180;
      const radLon = centerLon * Math.PI / 180;
      const dByR = radiusKm / R;

      for (let i = 0; i <= numPoints; i++) {
        const bearing = (i * 360.0 / numPoints) * Math.PI / 180.0;
        const lat = Math.asin(Math.sin(radLat) * Math.cos(dByR) + Math.cos(radLat) * Math.sin(dByR) * Math.cos(bearing));
        const lon = radLon + Math.atan2(Math.sin(bearing) * Math.sin(dByR) * Math.cos(radLat), Math.cos(dByR) - Math.sin(radLat) * Math.sin(lat));
        points.push([lon * 180 / Math.PI, lat * 180 / Math.PI]);
      }
      return points;
    }

    // draggable pin: coloured dot with a label above it
    const pins = {};
    function setPin(role, color, prefix, point) {
      if (!point || typeof point.longitude !== "number") {
        if (pins[role]) { pins[role].remove(); delete pins[role]; }
        return;
      }
      const text = prefix + "  ·  " + (point.label || (role === "origin" ? "Launch Site" : "Detonation Target"));
      if (!pins[role]) {
        const el = document.createElement("div");
        el.style.cssText = "width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:" + color;
        const label = document.createElement("div");
        label.style.cssText = "position:absolute;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;" +
          "font:600 13px 'Segoe UI',sans-serif;color:#ededed;background:rgba(0,0,0,0.75);padding:6px 10px;border-radius:4px";
        el.appendChild(label);
        const marker = new mapboxgl.Marker({ element: el, draggable: true }).setLngLat([point.longitude, point.latitude]).addTo(map);
        marker.on("dragend", () => {
          const p = marker.getLngLat();
          sendPick(role, p.lng, p.lat);
        });
        pins[role] = marker;
      }
      pins[role].setLngLat([point.longitude, point.latitude]);
      pins[role].getElement().firstChild.textContent = text;
    }

    // blast zones, outermost first so inner zones draw on top.
    // fill gets stronger toward the centre so severity reads at a glance.
    const ZONES = [
      { key: "light_blast_1psi_km",    name: "Light blast (1 psi)",    color: "#fde047", alpha: 0.06 },
      { key: "thermal_3rd_deg_km",     name: "3rd-degree burns",       color: "#f59e0b", alpha: 0.10 },
      { key: "moderate_blast_5psi_km", name: "Moderate blast (5 psi)", color: "#fb923c", alpha: 0.20 },
      { key: "heavy_blast_20psi_km",   name: "Heavy blast (20 psi)",   color: "#ef4444", alpha: 0.32 },
      { key: "fireball_km",            name: "Fireball",               color: "#fff7d6", alpha: 0.60 },
    ];
    const GROW_MS = 700;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let lastImpactKey = null;
    let growFrame = null;

    function formatKm(km) {
      if (!(km > 0)) return "—";
      if (km < 1) return Math.round(km * 1000) + " m";
      return (km < 10 ? km.toFixed(1) : Math.round(km).toLocaleString()) + " km";
    }

    function zoneRadiusKm(zone, radii) {
      const km = Number(radii[zone.key]) || 0;
      return zone.key === "fireball_km" ? Math.max(km, 0.05) : km;
    }

    function clearImpact() {
      cancelAnimationFrame(growFrame);
      map.getSource("zones").setData(EMPTY);
      document.getElementById("legend").classList.remove("show");
      lastImpactKey = null;
    }

    function renderImpact(state) {
      const radii = state.impact.radii_km;
      const lon = state.destination.longitude;
      const lat = state.destination.latitude;
      const key = JSON.stringify([lon, lat, radii]);
      if (key === lastImpactKey) return;  // same impact as before, keep current rings
      clearImpact();
      lastImpactKey = key;

      // rings burst out fast then settle (ease-out cubic), like a shockwave
      const start = performance.now();
      const draw = () => {
        const t = reduceMotion ? 1 : Math.min((performance.now() - start) / GROW_MS, 1);
        const grow = 1 - Math.pow(1 - t, 3);
        const features = ZONES.filter((z) => zoneRadiusKm(z, radii) > 0).map((z) =>
          polygon(computeCirclePoints(lon, lat, Math.max(zoneRadiusKm(z, radii) * grow, 0.001), 128), { color: z.color, alpha: z.alpha }));
        map.getSource("zones").setData({ type: "FeatureCollection", features });
        if (t < 1) growFrame = requestAnimationFrame(draw);
      };
      draw();

      // legend lists zones from the centre outward
      const rows = ZONES.slice().reverse().map((z) =>
        '<div class="legend-row">' +
          '<span class="legend-swatch" style="background:' + z.color + '"></span>' +
          '<span class="legend-name">' + z.name + '</span>' +
          '<span class="legend-value">' + formatKm(Number(radii[z.key])) + '</span>' +
        '</div>'
      ).join("");
      document.getElementById("legendRows").innerHTML = rows;
      document.getElementById("legend").classList.add("show");
    }

    function renderState(state) {
      setPin("origin", "#22c55e", "Launch", state.origin);
      setPin("destination", "#ef4444", "Target", state.destination);

      // max range circle
      const hasOrigin = state.origin && typeof state.origin.longitude === "number";
      if (hasOrigin && state.missile && state.missile.max_range_km) {
        const radiusKm = Math.min(Number(state.missile.max_range_km) || 0, 9500);
        const ring = computeCirclePoints(state.origin.longitude, state.origin.latitude, radiusKm);
        map.getSource("range").setData(polygon(ring));
      } else {
        map.getSource("range").setData(EMPTY);
      }

      // trajectory line
      if (state.origin && state.destination) {
        map.getSource("trajectory").setData(line(computeTrajectoryPoints(
          state.origin.longitude, state.origin.latitude,
          state.destination.longitude, state.destination.latitude
        )));
      } else {
        map.getSource("trajectory").setData(EMPTY);
      }

      // blast rings and legend if launched
      if (state.launched && state.impact && state.impact.radii_km && state.destination) {
        renderImpact(state);
      } else {
        clearImpact();
      }
    }

    // poll backend state every 250ms
    async function pollState() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (!res.ok) return;
        const state = await res.json();

        if (state.pick_mode && state.pick_mode !== currentPickMode) {
          currentPickMode = state.pick_mode;
          const modeLabel = currentPickMode === "origin" ? "Launch site"
            : currentPickMode === "none" ? "Off (drag a pin to move it)" : "Target";
          const pill = document.getElementById("pillModeText");
          if (pill) pill.innerText = "Map Click Mode: " + modeLabel;
        }

        if (state.fly_to && state.fly_to.fly_id !== lastFlyId) {
          lastFlyId = state.fly_to.fly_id;
          // fly_to.height is a camera altitude in metres; convert to an approximate zoom level
          const zoom = Math.min(Math.max(Math.log2(4.5e7 / Math.max(state.fly_to.height || 350000, 100)), 1), 18);
          const opts = { center: [state.fly_to.lon, state.fly_to.lat], zoom };
          if (reduceMotion) map.jumpTo(opts); else map.flyTo(opts);
        }

        if (state.version !== lastVersion) {
          lastVersion = state.version;
          renderState(state);
        }
      } catch (err) {
        // silent when connection is idle
      }
    }

    setInterval(pollState, 250);
  </script>
</body>
</html>
